name: Publish to PyPI

# Runs when you publish a GitHub Release. Uses PyPI trusted publishing, so no
# API token is stored in the repo. One-time setup on pypi.org:
#   Account -> Publishing -> Add a pending publisher
#   owner: whoami-harshal  repo: biovault  workflow: publish.yml  environment: pypi

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
