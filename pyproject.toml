[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biovault"
version = "2.0.0"
description = "DNA-inspired multi-layer file format"
authors = [{name = "Harshal"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "zstandard>=0.21.0",
]

[project.scripts]
biovault = "biovault.cli:main"